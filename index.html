<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeBlock – Block-based GameMaker</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/play.css">
  <!-- Blockly -->
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/en.js"></script>
</head>
<body>
  <div id="app">
    <!-- Top Toolbar -->
    <header id="toolbar">
      <div class="logo">
        <span class="logo-icon">▦</span>
        <span class="logo-text">CodeBlock</span>
      </div>
      <div class="toolbar-actions">
        <button id="btn-new" class="btn" title="New Project">New</button>
        <button id="btn-load" class="btn" title="Load Project">Load</button>
        <button id="btn-save" class="btn" title="Save Project">Save</button>
        <button id="btn-play" class="btn btn-primary" title="Play">▶ Play</button>
        <button id="btn-stop" class="btn" title="Stop" disabled>■ Stop</button>
        <button id="btn-compile" class="btn" title="Compile">Compile</button>
        <button id="btn-download" class="btn" title="Download Game">Download</button>
      </div>
      <div class="project-name">
        <input type="text" id="project-name" value="Untitled Project" placeholder="Project name">
      </div>
    </header>

    <!-- Main Layout -->
    <div id="main">
      <!-- Left: Toolbox + Editor -->
      <aside id="sidebar">
        <div id="blockly-toolbox"></div>
      </aside>

      <section id="editor-area">
        <div id="blockly-div"></div>
      </section>

      <!-- Right: Stage / Play Area -->
      <section id="stage-area">
        <div id="stage-header">
          <span>Stage</span>
          <div class="stage-controls">
            <button id="btn-fullscreen" class="btn-icon" title="Fullscreen">⛶</button>
          </div>
        </div>
        <canvas id="stage" width="480" height="360"></canvas>
        <div id="stage-info">
          <span id="fps">FPS: --</span>
          <span id="sprite-count">Sprites: 0</span>
        </div>
      </section>
    </div>

    <!-- Bottom: Console / Output -->
    <footer id="console-area">
      <div class="console-header">
        <span>Console</span>
        <button id="btn-clear-console" class="btn-icon">Clear</button>
      </div>
      <div id="console"></div>
    </footer>
  </div>

  <!-- Hidden file input for loading -->
  <input type="file" id="file-input" accept=".json,.codeblock" style="display:none">

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/blocks/motion.js"></script>
  <script src="js/blocks/looks.js"></script>
  <script src="js/blocks/events.js"></script>
  <script src="js/blocks/control.js"></script>
  <script src="js/blocks/sensing.js"></script>
  <script src="js/blocks/operators.js"></script>
  <script src="js/blocks/variables.js"></script>
  <script src="js/runtime.js"></script>
  <script src="js/compile.js"></script>
  <script src="js/download.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
